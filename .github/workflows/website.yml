name: Publish Website
on:
  schedule:
    - cron:  45 4 * * MON
  push:
    branches:
      - main
    paths:
      - .github/workflows/website.yml
      - docs/**
  pull_request:
    paths:
      - .github/workflows/website.yml
      - docs/**
# Read-only by default so a compromised build/link-check step can't reach a write-scoped token; the
# deploy job is granted exactly the contents: write that pushing to the gh-pages branch requires.
permissions:
  contents: read
jobs:
  website:
    name: Website
    uses: metio/ci/.github/workflows/hugo.yml@92eaf0dff9859e52fbbc3f07c7f9eb832b31ea3b # 2026.11.15155907
    permissions:
      contents: write
    with:
      source: docs
      cname: ilo.projects.metio.wtf
