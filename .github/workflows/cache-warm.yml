name: Warm Caches
on:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  warm-maven:
    name: Warm Maven cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        name: Clone Git Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: graal
        name: Set up GraalVM
        uses: graalvm/setup-graalvm@6f3fa030c4b8f77c1f554a860f593a654538fa38 # v1
        with:
          distribution: graalvm-community
          java-version: 25
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: cache
        name: Cache Maven Repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ github.job }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ github.job }}-
            maven-
      - id: resolve
        name: Resolve dependencies
        # Runs on the default branch only, so its cache is readable by every PR. The Maven repository is
        # OS-independent (pure-Java jars), so this single run seeds the shared base cache that each PR job
        # — on any OS — restores through the "maven-" restore-key prefix, fetching only its job-specific
        # delta. The integration profile is included so its extra dependencies are part of the base.
        run: mvn --batch-mode -Pintegration dependency:go-offline
